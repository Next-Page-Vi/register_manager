# Example single-node deployment. Put a TLS-terminating reverse proxy
# (Caddy, nginx, Traefik, ...) in front of port 8080.
#
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml logs app   # the super admin's first password
services:
  app:
    build: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RM_TRUSTED_PROXY_HEADER: X-Forwarded-For
    volumes:
      - data:/data

volumes:
  data:
