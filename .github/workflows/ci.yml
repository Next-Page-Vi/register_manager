name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm -C web lint
          pnpm -C web typecheck
          pnpm -C web check:i18n
          pnpm -C web check:api
          pnpm -C web build

      - name: Pure Go build
        run: CGO_ENABLED=0 go build -o /tmp/register-manager ./cmd/server

      - name: Go checks
        run: |
          test -z "$(gofmt -l . | grep -v '^web/node_modules/')"
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go test -race ./...

      - name: Fuzz the booking engine briefly
        run: go test ./internal/booking -run '^$' -fuzz FuzzSlotsAreValid -fuzztime 30s

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: End-to-end tests
        run: |
          pnpm -C web exec playwright install --with-deps chromium webkit
          pnpm -C web test:e2e

      - name: Upload end-to-end failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7
